name: 竞品自动监控与更新

on:
  schedule:
    # 每月1日和16日 UTC 2:00 → 北京时间 10:00
    - cron: "0 2 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      # ============ 策略1: 行业新闻聚合监控 ============
      - name: 行业新闻监控
        run: python industry_monitor.py --apply --output-report industry_report.md
        continue-on-error: true

      # ============ 策略2: 直接抓取 + 搜索 ============
      - name: 全品牌抓取
        run: python auto_scraper.py --apply --output-report scrape_report.md
        continue-on-error: true

      # ============ 检查是否有变更 ============
      - name: 检查变更
        id: check
        run: |
          if git diff --name-only | grep -q "index.html"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # ============ 自动提交并推送 ============
      - name: 自动提交推送
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "Hikrobot Auto-Update"
          git config user.email "auto-update@hikrobot.com"
          git add index.html index.html.bak 2>/dev/null || true
          git commit -m "Auto: 竞品数据库自动更新 ($(date +%Y-%m-%d))"
          git push origin HEAD:main
          echo "Committed and pushed to main"

      # ============ 通知分发 (多渠道) ============
      - name: 发送通知
        if: steps.check.outputs.changed == 'true'
        env:
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          MSG="轮廓仪竞品DB已自动更新\n时间: $(date '+%Y-%m-%d %H:%M')\n查看: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"

          [ -n "$SERVER_CHAN_KEY" ] && python notify.py --server-chan "$SERVER_CHAN_KEY" --title "海康轮廓仪-竞品更新" --message "$MSG"
          [ -n "$PUSHPLUS_TOKEN" ] && python notify.py --pushplus "$PUSHPLUS_TOKEN" --title "海康轮廓仪-竞品更新" --message "$MSG"
          [ -n "$FEISHU_WEBHOOK" ] && python notify.py --feishu "$FEISHU_WEBHOOK" --title "海康轮廓仪-竞品更新" --message "$MSG"
          [ -n "$WECOM_WEBHOOK" ] && python notify.py --wecom "$WECOM_WEBHOOK" --title "海康轮廓仪-竞品更新" --message "$MSG"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-reports
          path: "*.md"
